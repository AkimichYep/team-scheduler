# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set a fixed JDBC URL
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring AI - Configure OpenAI client for GROQ (OpenAI-compatible API)
#spring.ai.openai.api-key=${GROQ_API_KEY}
#spring.ai.openai.base-url=https://api.groq.com/openai/v1
#spring.ai.openai.chat.options.model=mixtral-8x7b-32768
#spring.ai.openai.chat.options.temperature=0.7
#spring.ai.openai.chat.options.top-p=1.0

# Point Spring AI to GROQ's OpenAI-compatible endpoint
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=

# Choose a GROQ-supported model
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
# Or: llama-3.1-8b-instant, mixtral-8x7b-32768, gemma2-9b-it